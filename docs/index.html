<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>英语词汇抢答 · IELTS</title>

  <!-- Tailwind CSS（Play CDN，单文件方案，需联网加载；如需完全离线可用下方内联样式替代） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'] },
        },
      },
    };
  </script>

  <style>
    /* 全局背景（参考附图暖米色调） */
    body { background: #faf6f1; }

    /* 字母徽标配色（参考附图：A红/B橙/C绿/D紫）*/
    .badge-a { background:#c96a5b; } .badge-b { background:#d99a4e; }
    .badge-c { background:#6fae72; } .badge-d { background:#9b7fc4; }

    /* 选项卡片：默认浅底 + 对应色调描边 */
    .opt-card  { transition: all .18s ease; cursor:pointer; }
    .opt-card:active { transform:scale(.985); }
    .opt-a { background:#fdf3f1; border:1px solid #efccc2; }
    .opt-b { background:#fdf6ec; border:1px solid #e9d0a8; }
    .opt-c { background:#f1f8f0; border:1px solid #bcdcbc; }
    .opt-d { background:#f4f1fb; border:1px solid #d3c7e8; }

    /* 判定态：正确卡片为绿色、错误卡片为红色 */
    .opt-correct { background:#e6f6e6 !important; border-color:#5cb85c !important; box-shadow:0 0 0 2px rgba(92,184,92,.35); }
    .opt-wrong   { background:#fdeceb !important; border-color:#d9534f !important; box-shadow:0 0 0 2px rgba(217,83,79,.35); }
    .opt-dim     { opacity:.45; pointer-events:none; }

    /* 倒计时圆环 */
    .ring-circle { transform:rotate(-90deg); transform-origin:50% 50%; }
  </style>
</head>

<body class="min-h-screen text-neutral-800">

  <!-- ===================== 顶部标签栏 ===================== -->
  <header class="max-w-3xl mx-auto px-4 pt-5 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2 flex-1 flex-wrap">
      <!-- 课程标签 -->
      <div class="flex items-center gap-2 bg-orange-100/80 text-orange-800 rounded-full px-4 py-1.5 text-sm font-medium">
        <span class="w-2 h-2 rounded-full bg-orange-500"></span> 英语词汇抢答 · IELTS
      </div>
      <!-- 实时时钟 -->
      <div class="flex items-center gap-1.5 bg-neutral-100 text-neutral-500 rounded-full px-4 py-1.5 text-sm tabular-nums">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span id="liveClock">--:--:--</span>
      </div>
      <!-- 词库筛选（按 cet_level：全部 / 雅思 / CET4 / CET6 / 考研 / 托福 / SAT） -->
      <select id="levelFilter" title="选择词库 / 难度"
        class="bg-white border border-neutral-200 text-neutral-700 rounded-full px-3 py-1.5 text-sm font-medium shadow-sm hover:bg-neutral-50 cursor-pointer"></select>
      <!-- 复习错题：进入只刷错题本模式 -->
      <button id="reviewWrongBtn" type="button" title="只刷错题本里留存的词"
        class="flex-none inline-flex items-center gap-1.5 bg-rose-50 border border-rose-200 text-rose-700 rounded-full px-3.5 py-1.5 text-sm font-medium shadow-sm hover:bg-rose-100 active:scale-95 transition">
        📕 复习错题
        <span id="wrongCountBadge" class="hidden bg-rose-600 text-white rounded-full px-1.5 text-xs tabular-nums">0</span>
      </button>
    </div>

    <!-- 右上角：进度徽标 + 倒计时圆环 -->
    <div class="flex items-center gap-3 flex-none">
      <!-- 跳转到后端 / 统计页 -->
      <a href="admin.html" title="打开统计 / 后端页"
        class="flex-none inline-flex items-center gap-1.5 bg-white border border-neutral-200 text-neutral-700 rounded-full px-3.5 py-1.5 text-sm font-medium shadow-sm hover:bg-neutral-50 active:scale-95 transition">
        ← 后端页
      </a>
      <!-- 进度徽标：当前第几个单词 / 全部单词个数 -->
      <div class="flex items-center gap-1.5 bg-white border border-neutral-200 text-neutral-700 rounded-full px-3.5 py-1.5 text-sm font-semibold tabular-nums shadow-sm" title="当前进度（已学 / 总词数）">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span id="progressTop">第 1 / 1 词</span>
      </div>
      <!-- 自动发音开关（美音） -->
      <button id="speakToggle" type="button" title="自动发音（美音）"
        class="flex-none w-10 h-10 rounded-full bg-white border border-neutral-200 text-lg shadow-sm hover:bg-neutral-50 active:scale-95 transition">🔊</button>
      <!-- 倒计时圆环 -->
      <div class="relative w-14 h-14 flex-none" title="剩余时间（秒）">
        <svg class="w-14 h-14 ring-circle" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="24" fill="none" stroke="#f0e4d6" stroke-width="5" />
          <circle id="ringProgress" cx="28" cy="28" r="24" fill="none" stroke="#c96a5b" stroke-width="5"
                  stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="0" />
        </svg>
        <div id="countdown" class="absolute inset-0 flex items-center justify-center text-xl font-bold tabular-nums text-neutral-800">--</div>
      </div>
    </div>
  </header>

  <!-- ===================== 主区域 ===================== -->
  <main class="max-w-3xl mx-auto px-4 pt-8 pb-24">

    <!-- 复习模式提示条 -->
    <div id="reviewBanner" class="hidden mb-4 mx-auto w-fit text-center text-sm text-rose-700 bg-rose-50 border border-rose-200 rounded-full px-4 py-1.5">📕 复习模式：只刷错题本里的词</div>

    <!-- 单词展示 -->
    <section class="text-center">
      <h1 id="word" class="text-5xl sm:text-6xl font-extrabold tracking-tight text-neutral-900">--</h1>
      <p id="phonetic" class="mt-3 text-lg text-neutral-400 font-medium">--</p>
      <!-- 手动重播美音 -->
      <button id="replayBtn" type="button"
        class="mt-4 inline-flex items-center gap-1.5 bg-amber-100 text-amber-800 rounded-full px-4 py-1.5 text-sm font-medium hover:bg-amber-200 active:scale-95 transition">
        <span class="text-base">🔊</span> 美音
      </button>
    </section>

    <!-- 选项列表（宽屏 2x2，手机单列） -->
    <section id="options" class="mt-10 grid grid-cols-1 sm:grid-cols-2 gap-4"></section>

    <!-- 错误时显示词根词缀 / 词源 -->
    <div id="rootInfo" class="hidden mt-6"></div>

    <!-- 底部：进度 + 下一题 / 结束 -->
    <div class="mt-10 flex items-center justify-between">
      <div class="text-sm text-neutral-400">
        <span id="progress">第 1 / 1 题</span>
      </div>
      <div class="flex items-center gap-3">
        <!-- 复习模式下：答对/答错后可标记「已掌握」移出错题本 -->
        <button id="masterBtn" type="button"
          class="hidden items-center gap-2 bg-emerald-600 text-white rounded-full px-6 py-3 text-base font-semibold shadow hover:bg-emerald-700 active:scale-95 transition">
          ✓ 已掌握，移出错题本
        </button>
        <button id="nextBtn" disabled
          class="hidden items-center gap-2 bg-neutral-900 text-white rounded-full px-8 py-3 text-base font-semibold shadow hover:bg-neutral-700 disabled:opacity-40 disabled:cursor-not-allowed">
        下一题 <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      </div>
    </div>

    <!-- 结束面板 -->
    <div id="finished" class="hidden mt-14 text-center"></div>
  </main>

  <!-- 词库（前端内嵌，纯静态） -->
  <script src="words.js"></script>
  <script src="morphemes.js"></script>
  <!-- Supabase 云同步（跨设备一致）：CDN + 配置 + 同步客户端；ENABLED=false 时完全不生效 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-sync.js"></script>

  <script>
    /* ==========================================================================
     * 雅思词汇用户端答题逻辑（纯静态版：词库内嵌 + 答题记录存 localStorage）
     * ========================================================================== */
    'use strict';

    // ---------- 常量 ----------
    const QUiZ_SECONDS = 12;            // 每题倒计时（秒）
    const OPTIONS = ['A', 'B', 'C', 'D'];
    const LS_KEY = 'ielts_answers_v1';  // 答题记录存储键
    const WRONG_KEY = 'ielts_wrong_v1'; // 错题本（留存）存储键：答错/超时的词永久留存于此，供复习
    const SESSION_KEY = 'ielts_session_v1'; // 答题进度（续接）存储键
    const AUTO_SPEAK_KEY = 'ielts_auto_speak_v1'; // 自动发音开关偏好

    // ---------- 状态 ----------
    const state = {
      words: [],
      queue: [],
      index: 0,
      current: null,
      answered: false,
      selected: null,
      correctCount: 0,
      tryCount: 0,
      optionCount: { A: 0, B: 0, C: 0, D: 0 },
      levelFilter: 'ALL',
      reviewWrong: false,   // 是否进入「复习错题」模式（仅刷错题本里的词）
      startTs: 0,
      timer: null,
    };

    // ---------- DOM 引用 ----------
    const $ = (id) => document.getElementById(id);
    const elWord = $('word'), elPhonetic = $('phonetic'), elOptions = $('options');
    const elProgress = $('progress'), elProgressTop = $('progressTop'), elNext = $('nextBtn'), elLive = $('liveClock');
    const elCountdown = $('countdown'), elRing = $('ringProgress'), elFinished = $('finished');
    const elSpeakToggle = $('speakToggle'), elReplay = $('replayBtn'), elRootInfo = $('rootInfo');
    const elLevelFilter = $('levelFilter');
    const elReviewWrong = $('reviewWrongBtn');
    const elWrongBadge = $('wrongCountBadge');
    const elReviewBanner = $('reviewBanner');
    const elMasterBtn = $('masterBtn');
    const RING_CIRC = 2 * Math.PI * 24;

    // 自动发音开关（默认开启；记忆用户偏好）
    let autoSpeak = (localStorage.getItem(AUTO_SPEAK_KEY) || '1') === '1';
    let voices = [];

    /* ==========================================================================
     * 数据层（纯前端：词库内嵌 + localStorage 记录）
     * ========================================================================== */

    // 读取本地答题记录
    function loadAnswers() {
      try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
      catch (e) { return []; }
    }
    // 追加一条答题记录
    function saveAnswer(rec) {
      const arr = loadAnswers();
      arr.push(rec);
      try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); }
      catch (e) { console.error('保存答题记录失败', e); }
    }

    // ---------- 错题本（留存）----------
    // 以 word_id 为键的对象：{ word_id, word, phonetic, correct_option,
    //   last_wrong_option, wrong_count, first_ts, last_ts }
    function loadWrong() {
      try { return JSON.parse(localStorage.getItem(WRONG_KEY) || '{}'); }
      catch (e) { return {}; }
    }
    function saveWrongMap(map) {
      try { localStorage.setItem(WRONG_KEY, JSON.stringify(map)); }
      catch (e) { console.error('保存错题本失败', e); }
    }
    // 每次答错或超时调用：把该词记入错题本并留存（累加错误次数 + 最近时间）
    function recordWrong(rec, current) {
      const map = loadWrong();
      const id = current.id;
      const now = new Date().toISOString();
      const prev = map[id] || {
        word_id: id, word: current.word, phonetic: current.phonetic,
        correct_option: current.correct_option, last_wrong_option: rec.selected_option,
        wrong_count: 0, first_ts: now, last_ts: now,
      };
      // 词库可能更新，刷新展示字段，确保留存信息始终准确
      prev.word = current.word;
      prev.phonetic = current.phonetic;
      prev.correct_option = current.correct_option;
      prev.last_wrong_option = rec.selected_option; // null 表示超时未作答
      prev.wrong_count = (prev.wrong_count || 0) + 1;
      prev.last_ts = now;
      if (!prev.first_ts) prev.first_ts = now;
      map[id] = prev;
      saveWrongMap(map);
      updateWrongBadge(); // 同步顶部错题计数徽标
    }
    // 从错题本移除（用户复习时主动标记「已掌握」）
    function removeWrong(wordId) {
      const map = loadWrong();
      if (map[wordId]) { delete map[wordId]; saveWrongMap(map); }
      updateWrongBadge();
    }

    // 词库筛选：按 cet_level 过滤当前词表
    function getLevels() {
      const set = new Set((window.WORDS || []).map((w) => w.cet_level).filter(Boolean));
      const order = [['ALL', '全部'], ['雅思', '雅思'], ['CET4', '四级 CET4'], ['CET6', '六级 CET6'], ['考研', '考研'], ['托福', '托福'], ['SAT', 'SAT']];
      const res = [];
      for (const [v, t] of order) if (v === 'ALL' || set.has(v)) res.push({ v, t });
      for (const l of set) if (!order.some((o) => o[0] === l)) res.push({ v: l, t: l });
      return res;
    }
    function getFilteredWords() {
      if (!state.levelFilter || state.levelFilter === 'ALL') return state.words;
      return state.words.filter((w) => w.cet_level === state.levelFilter);
    }

    // 复习错题模式队列：仅取错题本中留存的词（可叠加词库筛选）
    function buildWrongQueue() {
      const wrong = loadWrong();
      let list = state.words.filter((w) => wrong[String(w.id)]);
      if (state.levelFilter && state.levelFilter !== 'ALL') {
        list = list.filter((w) => w.cet_level === state.levelFilter);
      }
      return list;
    }

    // 加载词库（内嵌在 words.js 的 window.WORDS）
    function loadWords() {
      state.words = window.WORDS || [];
      if (state.words.length === 0) {
        elFinished.classList.remove('hidden');
        elFinished.innerHTML = '<p class="text-neutral-400">题库未加载，请确认 words.js 已随本页一同部署。</p>';
        return;
      }
      beginSession(true);
    }

    // 读取已持久化的答题进度（跨刷新续接）
    function loadSession() {
      try {
        const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
        if (s && Array.isArray(s.queue) && s.queue.length > 0 && s.index < s.queue.length) return s;
      } catch (e) { /* ignore */ }
      return null;
    }
    // 持久化当前进度（前端 ↔ localStorage 联动同步）
    function saveSession() {
      try {
        localStorage.setItem(SESSION_KEY, JSON.stringify({
          level: state.levelFilter,
          queue: state.queue,
          index: state.index,
          correctCount: state.correctCount,
          tryCount: state.tryCount,
          optionCount: state.optionCount,
          savedAt: new Date().toISOString(),
        }));
      } catch (e) { /* ignore */ }
    }
    function clearSession() {
      try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
    }

    function beginSession(resume) {
      // 复习错题模式：队列只取错题本中的词（可叠加词库筛选），不续接普通进度
      if (state.reviewWrong) {
        const list = buildWrongQueue();
        if (list.length === 0) {
          // 错题本已空（或当前筛选下无错题）：退出复习模式，回到普通模式
          state.reviewWrong = false;
          updateReviewUI();
        } else {
          state.queue = list.map((w) => w.id).sort(() => Math.random() - 0.5);
          state.index = 0;
          state.correctCount = 0;
          state.tryCount = 0;
          state.optionCount = { A: 0, B: 0, C: 0, D: 0 };
          clearSession();
          renderQuestion();
          return;
        }
      }
      let saved = resume ? loadSession() : null;
      // 已保存进度的词库筛选与当前不一致 → 放弃续接，按当前筛选重建队列（避免错位）
      if (saved && saved.level === state.levelFilter) {
        const valid = saved.queue.filter((id) => state.words.some((w) => w.id === id));
        if (valid.length === 0) saved = null;
        else {
          state.queue = valid;
          state.index = Math.min(saved.index || 0, valid.length - 1);
          state.correctCount = saved.correctCount || 0;
          state.tryCount = saved.tryCount || 0;
          state.optionCount = saved.optionCount || { A: 0, B: 0, C: 0, D: 0 };
        }
      }
      if (!saved || saved.level !== state.levelFilter) {
        const list = getFilteredWords();
        state.queue = list.map((w) => w.id).sort(() => Math.random() - 0.5);
        state.index = 0;
        state.correctCount = 0;
        state.tryCount = 0;
        state.optionCount = { A: 0, B: 0, C: 0, D: 0 };
        clearSession();
      }
      renderQuestion();
    }

    /* ==========================================================================
     * 渲染层
     * ========================================================================== */
    function updateView() { renderQuestion(); }

    function renderQuestion() {
      const wordId = state.queue[state.index];
      state.current = state.words.find((w) => w.id === wordId);
      state.answered = false;
      state.selected = null;
      state.startTs = Date.now();

      elWord.textContent = state.current.word;
      elPhonetic.textContent = state.current.phonetic;

      elProgress.textContent = `第 ${state.index + 1} / ${state.queue.length} 题`;
      elProgressTop.textContent = `第 ${state.index + 1} / ${state.queue.length} 词`;
      saveSession();
      elNext.classList.add('hidden');
      elNext.classList.remove('flex');
      elNext.disabled = true;
      if (elMasterBtn) { elMasterBtn.classList.add('hidden'); elMasterBtn.classList.remove('flex'); }
      elFinished.classList.add('hidden');
      elRootInfo.classList.add('hidden'); // 进入新题先清除上一题词根词缀

      elOptions.innerHTML = '';
      OPTIONS.forEach(function (letter) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `opt-card opt-${letter.toLowerCase()} rounded-2xl px-5 py-5 flex items-center gap-4 text-left`;
        card.dataset.option = letter;
        card.innerHTML =
          `<span class="badge-${letter.toLowerCase()} text-white rounded-lg w-9 h-9 flex-none flex items-center justify-center font-bold text-lg">${letter}</span>` +
          `<span class="flex-1 text-neutral-800 text-lg sm:text-xl font-medium leading-snug">${state.current.options[letter]}</span>` +
          `<span class="count-badge mx-1 text-neutral-300 bg-white/70 rounded-full w-8 h-8 flex items-center justify-center text-sm tabular-nums">0</span>`;
        card.addEventListener('click', onOptionClick);
        elOptions.appendChild(card);
      });

      startCountdown();
      renderCount(QUiZ_SECONDS, 1);

      // 进入单词页面自动播放美音（需浏览器支持且已产生过用户交互，否则手动点🔊）
      if (autoSpeak) speakWord(state.current.word);
    }

    function renderFeedback() {
      const cards = elOptions.querySelectorAll('.opt-card');
      const correct = state.current.correct_option;
      cards.forEach(function (card) {
        const letter = card.dataset.option;
        if (letter === correct) {
          card.classList.add('opt-correct');
        } else if (letter === state.selected) {
          card.classList.add('opt-wrong');
        } else {
          card.classList.add('opt-dim');
        }
      });
    }

    function renderFinished() {
      clearSession(); // 一轮结束，清掉续接进度，下次打开重新开始
      const total = state.tryCount;
      const rate = total === 0 ? 0 : Math.round((state.correctCount / total) * 100);
      elFinished.classList.remove('hidden');
      elFinished.innerHTML =
        `<div class="inline-block rounded-3xl bg-white p-8 shadow-sm border border-neutral-100">
           <h2 class="text-2xl font-bold text-neutral-900">本轮测验完成</h2>
           <div class="mt-4 flex items-center justify-center gap-6 text-sm text-neutral-500">
             <div><div class="text-2xl font-bold text-neutral-800">${total}</div>答题数</div>
             <div><div class="text-2xl font-bold text-green-600">${state.correctCount}</div>答对数</div>
             <div><div class="text-2xl font-bold text-neutral-800">${rate}%</div>正确率</div>
           </div>
           <button onclick="location.reload()" class="mt-6 bg-neutral-900 text-white rounded-full px-8 py-3 text-base font-semibold hover:bg-neutral-700">再来一轮</button>
         </div>`;
    }

    /* ==========================================================================
     * 倒计时
     * ========================================================================== */
    function renderCount(secondsLeft, ratio) {
      elCountdown.textContent = secondsLeft;
      elRing.style.strokeDasharray = String(RING_CIRC);
      elRing.style.strokeDashoffset = String(RING_CIRC * (1 - ratio));
      elRing.setAttribute('stroke', ratio > 0.5 ? '#c96a5b' : ratio > 0.25 ? '#d99a4e' : '#d9534f');
    }

    function startCountdown() {
      clearInterval(state.timer);
      let remaining = QUiZ_SECONDS;
      state.timer = setInterval(function () {
        remaining -= 1;
        if (remaining < 0) { clearInterval(state.timer); onTimeout(); return; }
        renderCount(remaining, remaining / QUiZ_SECONDS);
      }, 1000);
    }

    function onTimeout() {
      if (state.answered) return;
      state.answered = true;
      submitToLocal(null);
      renderFeedback();
      enableNext();
      if (state.reviewWrong) showMasterBtn();
      showRootInfo(state.current.word); // 超时：同样展示词根词缀 / 词源
    }

    /* ==========================================================================
     * 事件处理
     * ========================================================================== */
    function onOptionClick(e) {
      if (state.answered) return;
      const letter = e.currentTarget.dataset.option;
      state.answered = true;
      state.selected = letter;
      state.optionCount[letter] += 1;
      updateCountBadge(letter, state.optionCount[letter]);
      clearInterval(state.timer);

      const isRight = letter === state.current.correct_option;
      if (isRight) state.correctCount += 1;
      state.tryCount += 1;
      renderFeedback();
      submitToLocal(letter);
      if (isRight) {
        // 答对：短暂展示绿色反馈后自动进入下一题（无需手动点“下一题”）
        if (state.reviewWrong) showMasterBtn(); // 复习中答对也可标记「已掌握」
        setTimeout(onNext, 650);
      } else {
        enableNext();
        if (state.reviewWrong) showMasterBtn();
        showRootInfo(state.current.word); // 答错：拉取并展示词根词缀 / 词源
      }
    }

    function updateCountBadge(letter, count) {
      const badge = elOptions.querySelector(`.opt-card[data-option="${letter}"] .count-badge`);
      if (badge) badge.textContent = count;
    }

    /* ==========================================================================
     * 美音发音（浏览器内置 TTS，en-US；词库无音频文件，故用语音合成朗读）
     * ========================================================================== */
    function loadVoices() {
      try { voices = (window.speechSynthesis && window.speechSynthesis.getVoices()) || []; }
      catch (e) { voices = []; }
    }
    function pickUsVoice() {
      if (!voices || !voices.length) return null;
      // 优先选美音语音（lang=en-US / 名称含 United States）
      return voices.find((v) => /en[-_]US/i.test(v.lang)) ||
             voices.find((v) => /united states/i.test(v.name)) ||
             voices.find((v) => /^en/i.test(v.lang)) || null;
    }
    function speakWord(text) {
      if (!text || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel(); // 避免堆叠
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        const v = pickUsVoice();
        if (v) u.voice = v;
        u.rate = 0.92; u.pitch = 1.0;
        window.speechSynthesis.speak(u);
      } catch (e) { /* 浏览器不支持或自动播放被拦，忽略 */ }
    }
    function updateSpeakToggleUI() {
      if (!('speechSynthesis' in window)) return; // 不支持则保持隐藏
      elSpeakToggle.textContent = autoSpeak ? '🔊' : '🔇';
      elSpeakToggle.title = autoSpeak ? '自动发音：开（美音）' : '自动发音：关（点此开启）';
    }
    function onToggleSpeak() {
      autoSpeak = !autoSpeak;
      try { localStorage.setItem(AUTO_SPEAK_KEY, autoSpeak ? '1' : '0'); } catch (e) { /* ignore */ }
      updateSpeakToggleUI();
      if (autoSpeak && state.current) speakWord(state.current.word);
    }

    /* ==========================================================================
     * 词根词缀 / 词源
     * 默认：本地词素分析（morphemes.js，零网络依赖，校园网/受限网络可用）。
     * 可选：将下方 USE_ONLINE_ETYMOLOGY 改为 true，在网络通畅时叠加 dictionaryapi.dev 在线词源。
     * 仅在答错或超时时展示，帮助记忆。
     * ========================================================================== */
    const USE_ONLINE_ETYMOLOGY = false; // 默认关闭 → 纯本地，永远不出现「加载失败」
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }
    function parseRoot(data) {
      if (!Array.isArray(data) || !data.length) return '';
      let origin = '', def = '';
      for (const e of data) {
        if (e && e.origin && !origin) origin = e.origin;
        if (!def && e && Array.isArray(e.meanings)) {
          for (const m of e.meanings) {
            if (m.definitions && m.definitions[0] && m.definitions[0].definition) {
              def = m.definitions[0].definition;
              break;
            }
          }
        }
        if (origin && def) break;
      }
      if (!origin && !def) return '';
      let html = '<div class="rounded-2xl bg-indigo-50 border border-indigo-200 px-5 py-4 text-left">';
      html += '<div class="text-xs font-semibold text-indigo-700 mb-1">词根词缀 / 词源</div>';
      if (origin) html += '<div class="text-sm text-neutral-700 leading-relaxed">' + escapeHtml(origin) + '</div>';
      if (def) html += '<div class="mt-2 text-sm text-neutral-500">释义：' + escapeHtml(def) + '</div>';
      html += '</div>';
      return html;
    }
    /* 本地词素拆解渲染：将 analyzeMorpheme 的结果渲染为词缀/词根 chip */
    function renderMorpheme(info) {
      const order = ['prefix', 'root', 'suffix'];
      let chips = '';
      for (const t of order) {
        const p = info.parts.find((x) => x.type === t);
        if (!p) continue;
        chips += '<span class="inline-flex items-center gap-1 rounded-full bg-white border border-indigo-200 px-2.5 py-1 text-xs">'
          + '<b class="text-indigo-700">' + escapeHtml(p.text) + '</b>'
          + '<span class="text-neutral-500">' + escapeHtml(p.meaning) + '</span></span>';
      }
      let html = '<div class="rounded-2xl bg-indigo-50 border border-indigo-200 px-5 py-4 text-left">';
      html += '<div class="text-xs font-semibold text-indigo-700 mb-2">词根词缀拆解（本地 · 仅供参考）</div>';
      html += '<div class="flex flex-wrap gap-2">' + chips + '</div>';
      if (info.stem && info.stem.length >= 2) {
        html += '<div class="mt-2 text-xs text-neutral-500">剩余词干：<code class="bg-white px-1 rounded">'
          + escapeHtml(info.stem) + '</code></div>';
      }
      html += '</div>';
      return html;
    }

    /* 可选在线词源：仅在 USE_ONLINE_ETYMOLOGY=true 且网络通畅时生效；失败静默，不覆盖本地结果 */
    function fetchOnlineEtymology(word) {
      const url = 'https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word);
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 4000); // 4s 超时，避免卡住
      fetch(url, { signal: ctrl.signal })
        .then((r) => { if (!r.ok) throw new Error('notfound'); return r.json(); })
        .then((data) => {
          clearTimeout(timer);
          if (state.current && state.current.word !== word) return; // 用户已跳到下一题
          const extra = parseRoot(data);
          if (!extra) return;
          // 追加「在线词源」区块，不覆盖本地拆解
          const block = document.createElement('div');
          block.className = 'mt-3 rounded-2xl bg-white border border-neutral-200 px-5 py-4 text-left';
          block.innerHTML = '<div class="text-xs font-semibold text-neutral-600 mb-1">在线词源（dictionaryapi.dev）</div>'
            + extra.replace(/^<div[^>]*>/, '').replace(/<\/div>\s*$/, '');
          elRootInfo.appendChild(block);
        })
        .catch(() => { clearTimeout(timer); /* 静默：本地数据已展示 */ });
    }

    function showRootInfo(word) {
      elRootInfo.classList.remove('hidden');
      // 1) 本地词素分析（零网络，必成功）
      const info = (typeof analyzeMorpheme === 'function') ? analyzeMorpheme(word) : null;
      if (info) {
        elRootInfo.innerHTML = renderMorpheme(info);
      } else {
        elRootInfo.innerHTML = '<div class="text-sm text-neutral-400">暂无本地构词数据</div>';
      }
      // 2) 可选在线词源（默认关闭，避免网络受限时报错）
      if (USE_ONLINE_ETYMOLOGY) fetchOnlineEtymology(word);
    }

    /* ==========================================================================
     * 本地存储：记录答题结果（供管理端统计）
     * ========================================================================== */
    function submitToLocal(selectedOption) {
      const responseTime = Date.now() - state.startTs;
      const isCorrect = selectedOption !== null && selectedOption === state.current.correct_option;
      const rec = {
        word_id: state.current.id,
        selected_option: selectedOption,           // null 表示超时未作答
        is_correct: isCorrect ? 1 : 0,
        response_time_ms: responseTime,
        timestamp: new Date().toISOString(),
      };
      saveAnswer(rec);                            // 本地即时写入（离线可用）
      if (!isCorrect) recordWrong(rec, state.current); // 答错/超时 → 记入错题本留存
      if (window.SupabaseSync && window.SupabaseSync.isOn()) {
        window.SupabaseSync.pushAnswer(rec);       // 异步同步云端（失败静默，已留本地）
      }
    }

    function enableNext() {
      elNext.disabled = false;
      elNext.classList.remove('hidden');
      elNext.classList.add('flex');
    }

    function onNext() {
      clearInterval(state.timer);
      if (elMasterBtn) { elMasterBtn.classList.add('hidden'); elMasterBtn.classList.remove('flex'); }
      const isLast = state.index >= state.queue.length - 1;
      if (isLast) { renderFinished(); return; }
      state.index += 1;
      renderQuestion();
    }

    /* ---------- 错题本 UI 辅助 ---------- */
    // 顶部错题计数徽标：有留存错题时显示个数，否则隐藏
    function updateWrongBadge() {
      const n = Object.keys(loadWrong()).length;
      if (!elWrongBadge) return;
      if (n > 0) { elWrongBadge.textContent = n; elWrongBadge.classList.remove('hidden'); }
      else { elWrongBadge.classList.add('hidden'); }
    }
    // 复习模式提示条 + 按钮高亮态切换
    function updateReviewUI() {
      if (!elReviewWrong) return;
      if (state.reviewWrong) {
        elReviewWrong.classList.add('bg-rose-600', 'text-white', 'border-rose-600');
        elReviewWrong.classList.remove('bg-rose-50', 'text-rose-700', 'border-rose-200');
        elReviewBanner.classList.remove('hidden');
        elReviewBanner.textContent = `📕 复习模式：只刷错题本里的词（共 ${Object.keys(loadWrong()).length} 个）`;
      } else {
        elReviewWrong.classList.remove('bg-rose-600', 'text-white', 'border-rose-600');
        elReviewWrong.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-200');
        elReviewBanner.classList.add('hidden');
      }
    }
    // 复习模式下作答后展示「已掌握，移出错题本」按钮
    function showMasterBtn() {
      if (!elMasterBtn) return;
      elMasterBtn.classList.remove('hidden');
      elMasterBtn.classList.add('flex');
    }

    elNext.addEventListener('click', onNext);
    elReplay.addEventListener('click', () => { if (state.current) speakWord(state.current.word); });
    elSpeakToggle.addEventListener('click', onToggleSpeak);

    // 复习错题：切换只刷错题本模式（可叠加词库筛选）
    if (elReviewWrong) {
      elReviewWrong.addEventListener('click', () => {
        state.reviewWrong = !state.reviewWrong;
        updateReviewUI();
        beginSession(false);
      });
    }
    // 已掌握：移出错题本并进入下一题
    if (elMasterBtn) {
      elMasterBtn.addEventListener('click', () => {
        if (state.current) removeWrong(state.current.id);
        onNext();
      });
    }

    /* ==========================================================================
     * 顶部实时时钟（北京时间）
     * ========================================================================== */
    function tickClock() {
      const now = new Date();
      const bj = new Date(now.getTime() + (now.getTimezoneOffset() + 480) * 60000);
      const pad = (n) => String(n).padStart(2, '0');
      elLive.textContent = `北京时间 ${pad(bj.getHours())}:${pad(bj.getMinutes())}:${pad(bj.getSeconds())}`;
    }

    /* ==========================================================================
     * 启动
     * ========================================================================== */
    tickClock();
    setInterval(tickClock, 1000);

    // 初始化美音 TTS：载入语音列表 + 开关 UI；不支持则隐藏发音控件
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
      updateSpeakToggleUI();
    } else {
      elSpeakToggle.style.display = 'none';
      elReplay.style.display = 'none';
    }

    // 初始化词库筛选下拉（恢复上次筛选偏好；切换即重建队列，避免进度错位）
    (function initLevelFilter() {
      const levels = getLevels();
      elLevelFilter.innerHTML = levels.map((l) => `<option value="${l.v}">${escapeHtml(l.t)}</option>`).join('');
      const saved = loadSession();
      if (saved && saved.level && levels.some((l) => l.v === saved.level)) {
        state.levelFilter = saved.level;
      }
      elLevelFilter.value = state.levelFilter;
      elLevelFilter.addEventListener('change', () => {
        state.levelFilter = elLevelFilter.value;
        clearSession();
        beginSession(false);
      });
    })();

    // 初始化错题本：同步顶部计数徽标与复习模式 UI 状态
    updateWrongBadge();
    updateReviewUI();

    loadWords();
  </script>
</body>
</html>
